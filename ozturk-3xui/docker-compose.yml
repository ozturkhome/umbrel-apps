version: "3.7"

services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.9.0
    container_name: 3xui_app
    hostname: "3xui"
    volumes:
      - ${APP_DATA_DIR}/data:/etc/x-ui
      - ${APP_DATA_DIR}/data/acme:/root/.acme.sh
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      X_UI_ENABLE_FAIL2BAN: "true"
    tty: true
    network_mode: host
    restart: always